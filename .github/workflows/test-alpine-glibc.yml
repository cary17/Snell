name: Test Alpine with glibc

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/386, linux/arm64, linux/arm/v7]
        version: [v3.0.1, v4.1.1, v5.0.1, v6.0.0rc2]
        # The official v6 RC2 armv7 archive does not exist.
        exclude:
          - platform: linux/arm/v7
            version: v6.0.0rc2
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: SNELL_VERSION=${{ matrix.version }}
          pull: true
          load: true
          tags: snell-alpine-check:local
      - name: Startup and configuration regression
        env:
          SNELL_TEST_IMAGE: snell-alpine-check:local
          SNELL_TEST_PLATFORM: ${{ matrix.platform }}
          SNELL_TEST_VERSION: ${{ matrix.version }}
          SNELL_TEST_RESULTS: /tmp/snell-alpine-results
        run: bash tests/test_alpine_glibc.sh
      - name: TCP, UDP, IPv6 and DNS interop
        if: matrix.platform == 'linux/amd64' && !startsWith(matrix.version, 'v6.')
        env:
          SNELL_TEST_IMAGE: snell-alpine-check:local
          SNELL_TEST_VERSION: ${{ matrix.version }}
          SNELL_TEST_RESULTS: /tmp/snell-alpine-forwarding
        run: sudo -E python3 tests/test_alpine_forwarding.py
      - name: Test summary
        if: always()
        run: |
          for result in /tmp/snell-alpine-results/results.tsv /tmp/snell-alpine-forwarding/results.tsv; do
            if [ -f "$result" ]; then
              printf '\n```text\n' >> "$GITHUB_STEP_SUMMARY"
              cat "$result" >> "$GITHUB_STEP_SUMMARY"
              printf '```\n' >> "$GITHUB_STEP_SUMMARY"
            fi
          done
