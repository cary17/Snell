name: Sync Official Snell Archives

on:
  schedule:
    # 03:00 Asia/Shanghai (UTC+8).
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snell-repository-writer
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 0

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils unzip

      - name: Sync official stable archives
        id: sync
        run: bash scripts/sync-official-archives.sh

      - name: Commit updated archives
        if: steps.sync.outputs.changed == '1'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f Version/
          git diff --cached --quiet && exit 0
          git commit -m "chore: sync official Snell archives"
          git pull --rebase origin main
          git push origin HEAD:main
