name: Build and Push Snell Docker Image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - Snell.sh
      - download-snell.sh
      - entrypoint.sh
      - snell-config.yml
      - scripts/**
      - tests/**
      - docker-compose.yml
      - .github/workflows/build.yml
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Snell版本 (如 3.0.1、4.0.1、6.0.0b1, 留空自动获取)'
        required: false
        type: string
      debian_version:
        description: 'Debian 标签 (如 12-slim, stable-slim)'
        required: false
        default: 'stable-slim'
        type: string
      force:
        description: '强制构建'
        required: false
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate scripts and configuration
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          bash tests/test_snell.sh
          bash Snell.sh --self-test
          bash -n Snell.sh tests/test_snell.sh download-snell.sh
          sh -n entrypoint.sh
          shellcheck -S warning Snell.sh entrypoint.sh tests/test_snell.sh download-snell.sh
          docker compose config -q
          while IFS= read -r archive; do unzip -tq "$archive" >/dev/null; done < <(find Version -type f -name '*.zip' -print)

  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      major_version: ${{ steps.version.outputs.major_version }}
      should_build: ${{ steps.decide.outputs.should_build }}
      debian_tag: ${{ steps.debian.outputs.tag }}
      platforms: ${{ steps.platforms.outputs.list }}
      is_force: ${{ steps.decide.outputs.is_force }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: 确定 Debian 版本
        id: debian
        env:
          INPUT_DEBIAN_VERSION: ${{ github.event.inputs.debian_version || 'stable-slim' }}
        run: |
          [[ "$INPUT_DEBIAN_VERSION" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || { echo "Invalid Debian tag" >&2; exit 1; }
          echo "tag=$INPUT_DEBIAN_VERSION" >> "$GITHUB_OUTPUT"

      - name: 获取 Snell 版本
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            [[ "$INPUT_VERSION" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+[A-Za-z0-9._-]*$ ]] || { echo "Invalid Snell version" >&2; exit 1; }
            V_INPUT="$INPUT_VERSION"
            VERSION="v${V_INPUT#v}"
          else
            # 尝试从官网获取最新版本
            for _ in {1..5}; do
              VERSION=$(curl -fsSL https://kb.nssurge.com/surge-knowledge-base/zh/release-notes/snell \
                | grep -oP 'snell-server-v\K[0-9]+\.[0-9]+\.[0-9]+(?:[a-z]+[0-9]*)?' \
                | sort -V | tail -n1)
              if [ -n "$VERSION" ]; then
                break
              fi
              sleep 10
            done
            [ -z "$VERSION" ] && exit 1
            VERSION="v$VERSION"
          fi
          
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          
          # 提取主版本号
          MAJOR=$(echo "${VERSION#v}" | cut -d. -f1)
          echo "major_version=${MAJOR}" >> "$GITHUB_OUTPUT"
          echo "Detected version: ${VERSION} (major: ${MAJOR})"

      - name: 检查版本构建记录
        id: build-record
        env:
          CURRENT_VERSION: ${{ steps.version.outputs.version }}
        run: |
          [[ "$CURRENT_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+[A-Za-z0-9._-]*$ ]] || { echo "Invalid version" >&2; exit 1; }
          if [ -f ".build-records/${CURRENT_VERSION}.txt" ]; then
            echo "version_exists=true" >> "$GITHUB_OUTPUT"
            echo "Build record found for $CURRENT_VERSION"
          else
            echo "version_exists=false" >> "$GITHUB_OUTPUT"
            echo "No build record for $CURRENT_VERSION"
          fi

      - name: 检测可用平台
        id: platforms
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          V_NUM="${VERSION#v}"
          MAJOR_VERSION="${{ steps.version.outputs.major_version }}"
          BASE_URL="https://dl.nssurge.com/snell"
          PLATFORMS=""

          echo "Detecting platforms for Snell v${MAJOR_VERSION}..."

          for entry in "linux/amd64:amd64" "linux/386:i386" "linux/arm64:aarch64" "linux/arm/v7:armv7l"; do
            DOCKER_PLAT="${entry%%:*}"
            ARCH="${entry##*:}"
            FILE="snell-server-v${V_NUM}-linux-${ARCH}.zip"
            LOCAL_FILE="Version/v${V_NUM}/${FILE}"
            FOUND=false

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            if [ -f "$LOCAL_FILE" ]; then
              FOUND=true
              echo "✅ ${DOCKER_PLAT} from repository: ${LOCAL_FILE}"
            elif curl -4 -fsSL --head --connect-timeout 10 --max-time 30 --retry 3 --retry-delay 5 "${BASE_URL}/${FILE}" >/dev/null 2>&1 || \
                 curl -6 -fsSL --head --connect-timeout 10 --max-time 30 --retry 3 --retry-delay 5 "${BASE_URL}/${FILE}" >/dev/null 2>&1; then
              FOUND=true
              echo "✅ ${DOCKER_PLAT} from official fallback"
            else
              echo "❌ ${DOCKER_PLAT} not available in repository or official source"
            fi

            if [ "$FOUND" = "true" ]; then
              PLATFORMS="${PLATFORMS:+${PLATFORMS},}${DOCKER_PLAT}"
            fi
          done

          if [ -z "$PLATFORMS" ]; then
            echo "❌ No platforms available for this version"
            exit 1
          fi
          
          echo "list=${PLATFORMS}" >> "$GITHUB_OUTPUT"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Available platforms: ${PLATFORMS}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: 版本比对与决策
        id: decide
        run: |
          OFFICIAL="${{ steps.version.outputs.version }}"
          VERSION_EXISTS="${{ steps.build-record.outputs.version_exists }}"
          FORCE_BUILD="${{ github.event.inputs.force }}"
          [ "${{ github.event_name }}" = push ] && FORCE_BUILD=true
          
          echo "Official version: $OFFICIAL"
          echo "Version exists in records: $VERSION_EXISTS"
          echo "Force build: $FORCE_BUILD"
          
          # 判断是否需要构建
          if [ "$FORCE_BUILD" = "true" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "is_force=true" >> "$GITHUB_OUTPUT"
            echo "Force build enabled"
          elif [ "$VERSION_EXISTS" = "false" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "is_force=false" >> "$GITHUB_OUTPUT"
            echo "New version available: $OFFICIAL"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "is_force=false" >> "$GITHUB_OUTPUT"
            echo "Version $OFFICIAL already built, skipping"
          fi

  build-and-push:
    needs: [test, check-version]
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    concurrency:
      group: snell-repository-writer
      cancel-in-progress: false
    env:
      DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
        
      - name: 设置 QEMU 模拟器
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      
      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: 登录 GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 登录 Docker Hub
        if: env.DOCKER_HUB_TOKEN != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ env.DOCKER_HUB_USERNAME }}
          password: ${{ env.DOCKER_HUB_TOKEN }}

      - name: 自动创建 Docker Hub 仓库 (如果不存在)
        if: env.DOCKER_HUB_TOKEN != ''
        run: |
          REPO_NAME="snell"
          USER="$DOCKER_HUB_USERNAME"
          TOKEN="$DOCKER_HUB_TOKEN"

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -u "$USER:$TOKEN" "https://hub.docker.com/v2/repositories/$USER/$REPO_NAME/")

          if [ "$HTTP_STATUS" -eq 404 ]; then
            echo "仓库 $USER/$REPO_NAME 不存在，正在创建..."
            curl -s -X POST -u "$USER:$TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"name\":\"$REPO_NAME\",\"is_private\":false,\"description\":\"Snell Server Docker Image - Support v3 to v6+\"}" \
              "https://hub.docker.com/v2/repositories/$USER/"
            echo "仓库创建成功"
          else
            echo "仓库 $USER/$REPO_NAME 已存在"
          fi

      - name: 构建并推送镜像（禁用缓存）
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          platforms: ${{ needs.check-version.outputs.platforms }}
          build-args: |
            SNELL_VERSION=${{ needs.check-version.outputs.version }}
            BASE_TAG=${{ needs.check-version.outputs.debian_tag }}

          tags: |
            ghcr.io/${{ github.repository_owner }}/snell:${{ needs.check-version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/snell:latest
            ghcr.io/${{ github.repository_owner }}/snell:v${{ needs.check-version.outputs.major_version }}
            ${{ env.DOCKER_HUB_USERNAME != '' && format('{0}/snell:{1}', env.DOCKER_HUB_USERNAME, needs.check-version.outputs.version) || '' }}
            ${{ env.DOCKER_HUB_USERNAME != '' && format('{0}/snell:latest', env.DOCKER_HUB_USERNAME) || '' }}
            ${{ env.DOCKER_HUB_USERNAME != '' && format('{0}/snell:v{1}', env.DOCKER_HUB_USERNAME, needs.check-version.outputs.major_version) || '' }}
          # 禁用缓存
          cache-from: type=local,src=/dev/null
          no-cache: true

      - name: 镜像信息输出
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
          MAJOR_VERSION: ${{ needs.check-version.outputs.major_version }}
          DEBIAN_TAG: ${{ needs.check-version.outputs.debian_tag }}
          PLATFORMS: ${{ needs.check-version.outputs.platforms }}
          GHCR_OWNER: ${{ github.repository_owner }}
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ 镜像构建成功！"
          echo "版本: $VERSION"
          echo "主版本: $MAJOR_VERSION"
          echo "Debian 标签: $DEBIAN_TAG"
          echo "支持平台: $PLATFORMS"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "拉取镜像:"
          echo "docker pull ghcr.io/$GHCR_OWNER/snell:$VERSION"
          echo "docker pull ghcr.io/$GHCR_OWNER/snell:latest"
          echo "docker pull ghcr.io/$GHCR_OWNER/snell:v$MAJOR_VERSION"
          if [ -n "$DOCKER_HUB_USERNAME" ]; then
            echo "docker pull $DOCKER_HUB_USERNAME/snell:$VERSION"
            echo "docker pull $DOCKER_HUB_USERNAME/snell:latest"
            echo "docker pull $DOCKER_HUB_USERNAME/snell:v$MAJOR_VERSION"
          fi
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: 验证注册表制品
        id: verify-images
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
          EXPECTED_PLATFORMS: ${{ needs.check-version.outputs.platforms }}
          GHCR_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          ghcr_repo="ghcr.io/$GHCR_OWNER/snell"
          ghcr_image="$ghcr_repo:$VERSION"
          ghcr_manifest=$(docker buildx imagetools inspect "$ghcr_image" --format '{{json .Manifest}}')
          ghcr_digest=$(jq -r '.digest' <<< "$ghcr_manifest")
          actual_platforms=$(jq -r '.manifests[] | select(.platform.os != "unknown") | .platform.os + "/" + .platform.architecture + (if .platform.variant then "/" + .platform.variant else "" end)' <<< "$ghcr_manifest" | sort -u | paste -sd, -)
          # shellcheck disable=SC2153 # EXPECTED_PLATFORMS is supplied by the step env.
          expected_platforms=$(tr ',' '\n' <<< "$EXPECTED_PLATFORMS" | sort -u | paste -sd, -)
          [[ "$actual_platforms" == "$expected_platforms" ]] || { echo "Platform mismatch: expected=$expected_platforms actual=$actual_platforms" >&2; exit 1; }
          echo "ghcr_digest=$ghcr_digest" >> "$GITHUB_OUTPUT"

          archive_digests=""
          while IFS= read -r platform; do
            os=${platform%%/*}
            remainder=${platform#*/}
            arch=${remainder%%/*}
            variant=""
            [ "$remainder" = "$arch" ] || variant=${remainder#*/}
            manifest_digest=$(jq -r --arg os "$os" --arg arch "$arch" --arg variant "$variant" '
              .manifests[]
              | select(.platform.os == $os and .platform.architecture == $arch)
              | select((.platform.variant // "") == $variant)
              | .digest
            ' <<< "$ghcr_manifest")
            [[ "$manifest_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Missing manifest digest for $platform" >&2; exit 1; }
            exact_image="$ghcr_repo@$manifest_digest"
            docker pull "$exact_image" >/dev/null
            container=$(docker create "$exact_image")
            digest=$(docker cp "$container:/snell-archive-sha256" - | tar -xO | tr -d '\r\n')
            docker rm "$container" >/dev/null
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]] || { echo "Invalid archive SHA-256 for $platform" >&2; exit 1; }
            archive_digests="${archive_digests}${archive_digests:+$'\n'}${platform}=${digest}"
          done < <(tr ',' '\n' <<< "$EXPECTED_PLATFORMS")
          {
            echo 'archive_digests<<EOF'
            echo "$archive_digests"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

          if [ -n "$DOCKER_HUB_USERNAME" ]; then
            docker_image="$DOCKER_HUB_USERNAME/snell:$VERSION"
            docker_digest=$(docker buildx imagetools inspect "$docker_image" --format '{{.Manifest.Digest}}')
            [[ "$docker_digest" == "$ghcr_digest" ]] || { echo "Registry digest mismatch: GHCR=$ghcr_digest DockerHub=$docker_digest" >&2; exit 1; }
            echo "dockerhub_digest=$docker_digest" >> "$GITHUB_OUTPUT"
          fi

      - name: 记录已构建版本
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
          PLATFORMS: ${{ needs.check-version.outputs.platforms }}
          IMAGE_DIGEST: ${{ steps.verify-images.outputs.ghcr_digest }}
          ARCHIVE_DIGESTS: ${{ steps.verify-images.outputs.archive_digests }}
        run: |
          RECORD_FILE=".build-records/${VERSION}.txt"
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git pull origin main
          
          mkdir -p .build-records
          {
            echo "version=$VERSION"
            echo "commit=$GITHUB_SHA"
            echo "dockerfile_sha256=$(sha256sum Dockerfile | cut -d' ' -f1)"
            echo "platforms=$PLATFORMS"
            while IFS= read -r item; do
              platform=${item%%=*}
              digest=${item#*=}
              key=$(tr '/.' '__' <<< "$platform")
              echo "archive_sha256_${key}=$digest"
            done <<< "$ARCHIVE_DIGESTS"
            echo "image_digest=$IMAGE_DIGEST"
          } > "$RECORD_FILE"

          if ! git diff --quiet -- "$RECORD_FILE" || [[ -n "$(git status --short -- "$RECORD_FILE")" ]]; then
            git add "$RECORD_FILE"
            git commit -m "chore: record built snell version $VERSION"
            git push origin main
          else
            echo "Build record unchanged, skipping commit"
          fi
