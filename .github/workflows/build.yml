name: Build and Push Snell Docker Image

on:
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Snell版本 (如 3.0.1、4.0.1、6.0.0b1, 留空自动获取)'
        required: false
        type: string
      debian_version:
        description: 'Debian 标签 (如 12-slim, stable-slim)'
        required: false
        default: 'stable-slim'
        type: string
      force:
        description: '强制构建'
        required: false
        type: boolean
        default: false
      use_local_binary:
        description: '直接使用仓库 Version/ 目录中的二进制包构建'
        required: false
        type: boolean
        default: false

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      major_version: ${{ steps.version.outputs.major_version }}
      should_build: ${{ steps.decide.outputs.should_build }}
      debian_tag: ${{ steps.debian.outputs.tag }}
      platforms: ${{ steps.platforms.outputs.list }}
      is_force: ${{ steps.decide.outputs.is_force }}

    steps:
      - uses: actions/checkout@v5

      - name: 确定 Debian 版本
        id: debian
        run: echo "tag=${{ github.event.inputs.debian_version || 'stable-slim' }}" >> $GITHUB_OUTPUT

      - name: 获取 Snell 版本
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            V_INPUT="${{ github.event.inputs.version }}"
            VERSION="v${V_INPUT#v}"
          else
            # 尝试从官网获取最新版本
            for i in {1..5}; do
              VERSION=$(curl -fsSL https://kb.nssurge.com/surge-knowledge-base/zh/release-notes/snell \
                | grep -oP 'snell-server-v\K[0-9]+\.[0-9]+\.[0-9]+(?:[a-z][0-9]*)?' \
                | sort -V | tail -n1)
              [ -n "$VERSION" ] && break || sleep 10
            done
            [ -z "$VERSION" ] && exit 1
            VERSION="v$VERSION"
          fi
          
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          
          # 提取主版本号
          MAJOR=$(echo "${VERSION#v}" | cut -d. -f1)
          echo "major_version=${MAJOR}" >> $GITHUB_OUTPUT
          echo "Detected version: ${VERSION} (major: ${MAJOR})"

      - name: 获取已构建版本列表
        id: built-versions
        run: |
          # 从本地仓库获取已构建的版本列表
          BUILT_FILE="https://raw.githubusercontent.com/${{ github.repository }}/main/.built-versions"
          echo "Fetching built versions from: $BUILT_FILE"
          
          # 尝试获取文件，如果不存在则创建空列表
          if curl -fsSL "$BUILT_FILE" -o /tmp/built-versions.txt 2>/dev/null; then
            echo "✅ Built versions file found"
            cat /tmp/built-versions.txt
          else
            echo "⚠️  Built versions file not found, creating new one"
            echo "" > /tmp/built-versions.txt
          fi
          
          # 检查当前版本是否已构建
          CURRENT_VERSION="${{ steps.version.outputs.version }}"
          if grep -q "^${CURRENT_VERSION}$" /tmp/built-versions.txt 2>/dev/null; then
            echo "version_exists=true" >> $GITHUB_OUTPUT
            echo "Version $CURRENT_VERSION already built"
          else
            echo "version_exists=false" >> $GITHUB_OUTPUT
            echo "Version $CURRENT_VERSION is new"
          fi

      - name: 检测可用平台
        id: platforms
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          V_NUM="${VERSION#v}"
          MAJOR_VERSION="${{ steps.version.outputs.major_version }}"
          BASE_URL="https://dl.nssurge.com/snell"
          LOCAL_BASE_URL="https://raw.githubusercontent.com/${{ github.repository }}/main/Version"
          USE_LOCAL_BINARY="${{ github.event.inputs.use_local_binary || 'false' }}"
          PLATFORMS=""
          
          # 判断是否为测试版（包含字母，如 6.0.0b1）
          IS_BETA=false
          if echo "$V_NUM" | grep -q '[a-z]'; then
            IS_BETA=true
            echo "📌 Beta version detected: $VERSION (no local backup)"
          fi

          echo "Detecting platforms for Snell v${MAJOR_VERSION}..."
          
          for entry in "linux/amd64:amd64" "linux/386:i386" "linux/arm64:aarch64" "linux/arm/v7:armv7l"; do
            DOCKER_PLAT="${entry%%:*}"
            ARCH="${entry##*:}"
            FILE="snell-server-v${V_NUM}-linux-${ARCH}.zip"
            FOUND=false
            
            if [ "$USE_LOCAL_BINARY" = "true" ]; then
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              echo "Checking local repository package for $DOCKER_PLAT: $FILE"
              if [ -f "Version/v${V_NUM}/${FILE}" ]; then
                FOUND=true
                echo "✅ ${DOCKER_PLAT} from local repository"
              else
                echo "❌ ${DOCKER_PLAT} local package not found"
              fi
            # 非测试版：尝试从官方下载
            elif [ "$IS_BETA" = "false" ]; then
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              echo "Checking $DOCKER_PLAT: $FILE"
              
              # 1. 强制 IPv4 + 超时重试
              echo "📡 Attempt 1: IPv4 with timeout/retry..."
              if curl -4 -o /dev/null -s -w "%{http_code}" \
                --connect-timeout 10 \
                --max-time 30 \
                --retry 3 \
                --retry-delay 5 \
                --head "${BASE_URL}/${FILE}" 2>/dev/null | grep -q "200"; then
                FOUND=true
                echo "✅ ${DOCKER_PLAT} from official (IPv4)"
              else
                # 2. 尝试 IPv6
                echo "📡 Attempt 2: IPv6 with timeout/retry..."
                if curl -6 -o /dev/null -s -w "%{http_code}" \
                  --connect-timeout 10 \
                  --max-time 30 \
                  --retry 3 \
                  --retry-delay 5 \
                  --head "${BASE_URL}/${FILE}" 2>/dev/null | grep -q "200"; then
                  FOUND=true
                  echo "✅ ${DOCKER_PLAT} from official (IPv6)"
                else
                  # 3. 官方都失败，使用本地仓库备份
                  echo "📡 Attempt 3: Official failed, trying local repository..."
                  if curl -fsSL --head --connect-timeout 10 --max-time 30 \
                    "${LOCAL_BASE_URL}/v${V_NUM}/${FILE}" > /dev/null 2>&1; then
                    FOUND=true
                    echo "✅ ${DOCKER_PLAT} from local repository"
                  else
                    echo "❌ ${DOCKER_PLAT} not available anywhere"
                  fi
                fi
              fi
            else
              # 测试版：只能从官方下载，没有本地备份
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              echo "Checking $DOCKER_PLAT (beta): $FILE"
              
              # 尝试 IPv4
              if curl -4 -o /dev/null -s -w "%{http_code}" \
                --connect-timeout 10 \
                --max-time 30 \
                --retry 3 \
                --retry-delay 5 \
                --head "${BASE_URL}/${FILE}" 2>/dev/null | grep -q "200"; then
                FOUND=true
                echo "✅ ${DOCKER_PLAT} from official (IPv4)"
              elif curl -6 -o /dev/null -s -w "%{http_code}" \
                --connect-timeout 10 \
                --max-time 30 \
                --retry 3 \
                --retry-delay 5 \
                --head "${BASE_URL}/${FILE}" 2>/dev/null | grep -q "200"; then
                FOUND=true
                echo "✅ ${DOCKER_PLAT} from official (IPv6)"
              else
                echo "❌ ${DOCKER_PLAT} not available from official"
              fi
            fi
            
            if [ "$FOUND" = "true" ]; then
              PLATFORMS="${PLATFORMS:+${PLATFORMS},}${DOCKER_PLAT}"
            fi
          done

          if [ -z "$PLATFORMS" ]; then
            echo "❌ No platforms available for this version"
            exit 1
          fi
          
          echo "list=${PLATFORMS}" >> $GITHUB_OUTPUT
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Available platforms: ${PLATFORMS}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: 版本比对与决策
        id: decide
        run: |
          OFFICIAL="${{ steps.version.outputs.version }}"
          VERSION_EXISTS="${{ steps.built-versions.outputs.version_exists }}"
          FORCE_BUILD="${{ github.event.inputs.force }}"
          
          echo "Official version: $OFFICIAL"
          echo "Version exists in records: $VERSION_EXISTS"
          echo "Force build: $FORCE_BUILD"
          
          # 判断是否需要构建
          if [ "$FORCE_BUILD" = "true" ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "is_force=true" >> $GITHUB_OUTPUT
            echo "Force build enabled"
          elif [ "$VERSION_EXISTS" = "false" ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "is_force=false" >> $GITHUB_OUTPUT
            echo "New version available: $OFFICIAL"
          else
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "is_force=false" >> $GITHUB_OUTPUT
            echo "Version $OFFICIAL already built, skipping"
          fi

  build-and-push:
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
        
      - name: 设置 QEMU 模拟器
        uses: docker/setup-qemu-action@v4
      
      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录 GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 登录 Docker Hub
        if: env.DOCKER_HUB_TOKEN != ''
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKER_HUB_USERNAME }}
          password: ${{ env.DOCKER_HUB_TOKEN }}

      - name: 自动创建 Docker Hub 仓库 (如果不存在)
        if: env.DOCKER_HUB_TOKEN != ''
        run: |
          REPO_NAME="snell"
          USER="${{ env.DOCKER_HUB_USERNAME }}"
          TOKEN="${{ env.DOCKER_HUB_TOKEN }}"

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -u "$USER:$TOKEN" "https://hub.docker.com/v2/repositories/$USER/$REPO_NAME/")

          if [ "$HTTP_STATUS" -eq 404 ]; then
            echo "仓库 $USER/$REPO_NAME 不存在，正在创建..."
            curl -s -X POST -u "$USER:$TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"name\":\"$REPO_NAME\",\"is_private\":false,\"description\":\"Snell Server Docker Image - Support v3 to v6+\"}" \
              "https://hub.docker.com/v2/repositories/$USER/"
            echo "仓库创建成功"
          else
            echo "仓库 $USER/$REPO_NAME 已存在"
          fi

      - name: 构建并推送镜像（禁用缓存）
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: ${{ needs.check-version.outputs.platforms }}
          build-args: |
            SNELL_VERSION=${{ needs.check-version.outputs.version }}
            BASE_TAG=${{ needs.check-version.outputs.debian_tag }}
            GITHUB_REPOSITORY=${{ github.repository }}
            USE_LOCAL_BINARY=${{ github.event.inputs.use_local_binary || 'false' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/snell:${{ needs.check-version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/snell:latest
            ghcr.io/${{ github.repository_owner }}/snell:v${{ needs.check-version.outputs.major_version }}
            ${{ env.DOCKER_HUB_USERNAME != '' && format('{0}/snell:{1}', env.DOCKER_HUB_USERNAME, needs.check-version.outputs.version) || '' }}
            ${{ env.DOCKER_HUB_USERNAME != '' && format('{0}/snell:latest', env.DOCKER_HUB_USERNAME) || '' }}
            ${{ env.DOCKER_HUB_USERNAME != '' && format('{0}/snell:v{1}', env.DOCKER_HUB_USERNAME, needs.check-version.outputs.major_version) || '' }}
          # 禁用缓存
          cache-from: type=local,src=/dev/null
          no-cache: true

      - name: 镜像信息输出
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ 镜像构建成功！"
          echo "版本: ${{ needs.check-version.outputs.version }}"
          echo "主版本: ${{ needs.check-version.outputs.major_version }}"
          echo "Debian 标签: ${{ needs.check-version.outputs.debian_tag }}"
          echo "支持平台: ${{ needs.check-version.outputs.platforms }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "拉取镜像:"
          echo "docker pull ghcr.io/${{ github.repository_owner }}/snell:${{ needs.check-version.outputs.version }}"
          echo "docker pull ghcr.io/${{ github.repository_owner }}/snell:latest"
          echo "docker pull ghcr.io/${{ github.repository_owner }}/snell:v${{ needs.check-version.outputs.major_version }}"
          if [ -n "${{ env.DOCKER_HUB_USERNAME }}" ]; then
            echo "docker pull ${{ env.DOCKER_HUB_USERNAME }}/snell:${{ needs.check-version.outputs.version }}"
            echo "docker pull ${{ env.DOCKER_HUB_USERNAME }}/snell:latest"
            echo "docker pull ${{ env.DOCKER_HUB_USERNAME }}/snell:v${{ needs.check-version.outputs.major_version }}"
          fi
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: 记录已构建版本
        if: needs.check-version.outputs.is_force != 'true'
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          BUILT_FILE=".built-versions"
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git pull origin main
          
          if [ ! -f "$BUILT_FILE" ]; then
            echo "# Snell built versions record" > "$BUILT_FILE"
            echo "# Format: vX.X.X" >> "$BUILT_FILE"
            echo "" >> "$BUILT_FILE"
          fi
          
          if ! grep -q "^${VERSION}$" "$BUILT_FILE"; then
            echo "$VERSION" >> "$BUILT_FILE"
            echo "✅ Added $VERSION to $BUILT_FILE"
            
            git add "$BUILT_FILE"
            git commit -m "chore: record built snell version $VERSION"
            git push origin main
          else
            echo "⚠️  Version $VERSION already recorded, skipping"
          fi
