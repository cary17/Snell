name: Cleanup workflow runs

on:
  schedule:
    # Runs every Friday at 00:00 UTC.
    - cron: "0 0 * * 5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List workflow runs without deleting them"
        required: false
        default: false
        type: boolean
      retention_days:
        description: "Delete runs older than this many days"
        required: false
        default: 90
        type: number
      keep_latest:
        description: "Always keep this many newest completed runs"
        required: false
        default: 20
        type: number

permissions:
  actions: write
  contents: read

concurrency:
  group: cleanup-workflow-runs
  cancel-in-progress: false

jobs:
  cleanup:
    name: Delete workflow run history
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      CURRENT_RUN_ID: ${{ github.run_id }}
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
      RETENTION_DAYS: ${{ github.event.inputs.retention_days || '90' }}
      KEEP_LATEST: ${{ github.event.inputs.keep_latest || '20' }}
    steps:
      - name: Delete workflow runs
        shell: bash
        run: |
          set -euo pipefail

          deleted=0
          skipped=0
          failed=0

          echo "Repository: ${REPOSITORY}"
          echo "Current run: ${CURRENT_RUN_ID}"
          echo "Dry run: ${DRY_RUN}"
          echo "Retention days: ${RETENTION_DAYS}"
          echo "Keep latest: ${KEEP_LATEST}"
          [[ "$RETENTION_DAYS" =~ ^[0-9]+$ ]] || { echo "Invalid retention days" >&2; exit 1; }
          [[ "$KEEP_LATEST" =~ ^[0-9]+$ ]] || { echo "Invalid keep_latest" >&2; exit 1; }
          cutoff=$(date -u -d "${RETENTION_DAYS} days ago" +%s)

          run_ids_file="$(mktemp)"
          if ! gh api --paginate "repos/${REPOSITORY}/actions/runs?status=completed&per_page=100" \
            --jq '.workflow_runs[] | [.id, .created_at] | @tsv' > "${run_ids_file}"; then
            echo "Failed to enumerate completed workflow runs" >&2
            exit 1
          fi

          position=0
          while IFS=$'\t' read -r run_id created_at; do
            if [[ -z "${run_id}" ]]; then
              continue
            fi

            position=$((position + 1))
            if (( position <= KEEP_LATEST )); then
              skipped=$((skipped + 1))
              continue
            fi

            if [[ "${run_id}" == "${CURRENT_RUN_ID}" ]]; then
              echo "Skipping current run ${run_id}"
              skipped=$((skipped + 1))
              continue
            fi

            created_epoch=$(date -u -d "$created_at" +%s)
            if (( created_epoch >= cutoff )); then
              skipped=$((skipped + 1))
              continue
            fi

            if [[ "${DRY_RUN}" == "true" ]]; then
              echo "Would delete run ${run_id}"
              skipped=$((skipped + 1))
              continue
            fi

            if gh api --method DELETE "repos/${REPOSITORY}/actions/runs/${run_id}" >/dev/null; then
              echo "Deleted run ${run_id}"
              deleted=$((deleted + 1))
            else
              echo "Failed to delete run ${run_id}" >&2
              failed=$((failed + 1))
            fi
          done < "${run_ids_file}"

          {
            echo "## Workflow run cleanup"
            echo ""
            echo "| Result | Count |"
            echo "| --- | ---: |"
            echo "| Deleted | ${deleted} |"
            echo "| Skipped | ${skipped} |"
            echo "| Failed | ${failed} |"
          } >> "${GITHUB_STEP_SUMMARY}"

          if (( failed > 0 )); then
            exit 1
          fi
